<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin - TopUpKoroBD</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:Arial,sans-serif;background:#020914;color:#fff;min-height:100vh}
button,input{font-family:inherit}
button{cursor:pointer}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:380px;background:#07182d;border:1px solid #15395f;border-radius:18px;padding:26px}
.login-box h1{font-size:22px;margin-bottom:6px}
.login-box h1 span{color:#ffd500}
.login-box p{color:#8fa8c5;font-size:13px;margin-bottom:18px}
label{display:block;color:#b9cbe1;font-size:13px;font-weight:bold;margin:14px 0 6px}
input{width:100%;padding:13px;background:#031022;border:1px solid #23486d;color:#fff;border-radius:10px;outline:none;font-size:15px}
input:focus{border-color:#3c9cff}
.btn-main{width:100%;margin-top:20px;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#ffe600,#ffb800);color:#111;font-weight:900;font-size:16px}
.err{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:16px}

.topbar{position:sticky;top:0;z-index:10;background:rgba(2,9,20,.96);border-bottom:1px solid #164579;display:flex;align-items:center;justify-content:space-between;padding:13px 16px}
.topbar .logo{font-weight:900;font-size:18px}
.topbar .logo span{color:#ffd500}
.logout{background:none;border:1px solid #2b5a8c;color:#d8e7ff;padding:7px 12px;border-radius:9px;font-size:13px}
.wrap{max-width:900px;margin:auto;padding:16px 14px 50px}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tab{flex:none;background:#07182d;border:1px solid #15395f;color:#b9cbe1;padding:8px 13px;border-radius:20px;font-size:13px;font-weight:bold}
.tab.active{background:#ffd500;border-color:#ffd500;color:#111}
.tab .n{opacity:.7;margin-left:4px}

.notice{background:#3a1010;border:1px solid #7a2626;color:#ffb3b3;padding:12px;border-radius:12px;font-size:13px;margin-bottom:14px}
.empty{text-align:center;color:#8fa8c5;padding:50px 10px}

.card{background:linear-gradient(145deg,#092044,#06152a);border:1px solid #1b528d;border-radius:16px;padding:16px;margin-bottom:12px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.pkg{font-weight:900;font-size:16px}
.price{color:#ffd500;font-weight:900;margin-top:3px}
.badge{flex:none;padding:5px 10px;border-radius:14px;font-size:12px;font-weight:bold}
.s-pending{background:#4a3a00;color:#ffd500}
.s-approved{background:#0d3a5c;color:#5cc0ff}
.s-delivered{background:#063d2b;color:#42ff9b}
.s-rejected{background:#4a1414;color:#ff7b7b}

.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #142c48;font-size:14px}
.row:last-of-type{border-bottom:0}
.row .k{color:#8ba2bb;flex:none}
.row .v{text-align:right;font-weight:bold;word-break:break-all}
.dup{display:inline-block;margin-left:6px;background:#ff3b30;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px}

.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions button{flex:1;min-width:90px;padding:11px;border:0;border-radius:10px;font-weight:900;font-size:14px}
.a-approve{background:#1e88e5;color:#fff}
.a-deliver{background:#00c853;color:#fff}
.a-reject{background:#3a1b1b;color:#ff8a8a;border:1px solid #7a2626!important}
.actions button:disabled{opacity:.5}
</style>
</head>

<body>

<div class="login-wrap" id="loginView">
  <form class="login-box" id="loginForm">
    <h1>🎮 TopUpKoro<span>BD</span> Admin</h1>
    <p>অ্যাডমিন ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন।</p>

    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>

    <button class="btn-main" type="submit" id="loginBtn">Login</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="appView" hidden>
  <div class="topbar">
    <div class="logo">🎮 TopUpKoro<span>BD</span> Admin</div>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>

  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div class="notice" id="notice" hidden></div>
    <div id="list"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ====== এখানে নিজের Firebase config বসাও ====== */
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};
/* =============================================== */

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = (id) => document.getElementById(id);
const STATUSES = ["all", "pending", "approved", "delivered", "rejected"];

let orders = [];
let filter = "pending";
let unsubscribe = null;

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginErr").textContent = "";
  $("loginBtn").disabled = true;
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  } catch (err) {
    $("loginErr").textContent = "ইমেইল বা পাসওয়ার্ড ভুল হয়েছে।";
  }
  $("loginBtn").disabled = false;
});

$("logoutBtn").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if (user) {
    $("loginView").hidden = true;
    $("appView").hidden = false;
    startListening();
  } else {
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    orders = [];
    $("appView").hidden = true;
    $("loginView").hidden = false;
    $("password").value = "";
  }
});

function startListening() {
  if (unsubscribe) unsubscribe();
  const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
  unsubscribe = onSnapshot(q,
    (snap) => {
      $("notice").hidden = true;
      orders = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      render();
    },
    (err) => {
      $("notice").hidden = false;
      $("notice").textContent =
        "অর্ডার লোড হয়নি। Firestore Rules এ ADMIN_UID ঠিক আছে কিনা দেখুন। (" + err.code + ")";
    }
  );
}

async function setStatus(id, status) {
  if ((status === "delivered" || status === "rejected") &&
      !confirm("নিশ্চিত? স্ট্যাটাস হবে: " + status)) return;
  try {
    await updateDoc(doc(db, "orders", id), { status });
  } catch (err) {
    alert("আপডেট হয়নি: " + err.code);
  }
}

function render() {
  const counts = { all: orders.length };
  STATUSES.slice(1).forEach((s) => counts[s] = orders.filter((o) => o.status === s).length);

  const tabs = $("tabs");
  tabs.textContent = "";
  STATUSES.forEach((s) => {
    const b = document.createElement("button");
    b.className = "tab" + (s === filter ? " active" : "");
    b.append(s.charAt(0).toUpperCase() + s.slice(1));
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = counts[s];
    b.append(n);
    b.onclick = () => { filter = s; render(); };
    tabs.append(b);
  });

  const trxCount = {};
  orders.forEach((o) => {
    const t = String(o.trx || "").trim().toLowerCase();
    if (t) trxCount[t] = (trxCount[t] || 0) + 1;
  });

  const list = $("list");
  list.textContent = "";
  const shown = orders.filter((o) => filter === "all" || o.status === filter);

  if (!shown.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "এই ক্যাটাগরিতে কোনো অর্ডার নেই।";
    list.append(d);
    return;
  }

  shown.forEach((o) => list.append(buildCard(o, trxCount)));
}

function buildCard(o, trxCount) {
  const card = document.createElement("div");
  card.className = "card";

  const top = document.createElement("div");
  top.className = "card-top";
  const left = document.createElement("div");
  const pkg = document.createElement("div");
  pkg.className = "pkg";
  pkg.textContent = o.package || "-";
  const price = document.createElement("div");
  price.className = "price";
  price.textContent = (o.price ?? "-") + " TK";
  left.append(pkg, price);

  const badge = document.createElement("div");
  badge.className = "badge s-" + (o.status || "pending");
  badge.textContent = o.status || "pending";
  top.append(left, badge);
  card.append(top);

  const when = o.createdAt && o.createdAt.toDate
    ? o.createdAt.toDate().toLocaleString("en-GB") : "-";

  card.append(
    row("eFootball ID", o.userId),
    row("KONAMI", o.konami),
    row("Phone", o.phone),
    row("Gmail", o.gmail),
    row("TrxID", o.trx, trxCount[String(o.trx || "").trim().toLowerCase()] > 1),
    row("Time", when)
  );

  const act = document.createElement("div");
  act.className = "actions";
  if (o.status === "pending") {
    act.append(btn("Approve", "a-approve", () => setStatus(o.id, "approved")));
  }
  if (o.status === "pending" || o.status === "approved") {
    act.append(btn("Delivered", "a-deliver", () => setStatus(o.id, "delivered")));
  }
  if (o.status !== "rejected" && o.status !== "delivered") {
    act.append(btn("Reject", "a-reject", () => setStatus(o.id, "rejected")));
  }
  if (act.children.length) card.append(act);

  return card;
}

function row(k, v, dup) {
  const r = document.createElement("div");
  r.className = "row";
  const a = document.createElement("span");
  a.className = "k";
  a.textContent = k;
  const b = document.createElement("span");
  b.className = "v";
  b.textContent = v || "-";
  if (dup) {
    const d = document.createElement("span");
    d.className = "dup";
    d.textContent = "DUPLICATE";
    b.append(d);
  }
  r.append(a, b);
  return r;
}

function btn(text, cls, fn) {
  const b = document.createElement("button");
  b.className = cls;
  b.textContent = text;
  b.onclick = fn;
  return b;
}
</script>

</body>
  </html>
