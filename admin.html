<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin - TopUpKoroBD</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:Arial,sans-serif;background:#020914;color:#fff;min-height:100vh}
button,input{font-family:inherit}
button{cursor:pointer}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:380px;background:#07182d;border:1px solid #15395f;border-radius:18px;padding:26px}
.login-box h1{font-size:22px;margin-bottom:6px}
.login-box h1 span{color:#ffd500}
.login-box p{color:#8fa8c5;font-size:13px;margin-bottom:18px}
label{display:block;color:#b9cbe1;font-size:13px;font-weight:bold;margin:14px 0 6px}
input{width:100%;padding:13px;background:#031022;border:1px solid #23486d;color:#fff;border-radius:10px;outline:none;font-size:15px}
input:focus{border-color:#3c9cff}
.btn-main{width:100%;margin-top:20px;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#ffe600,#ffb800);color:#111;font-weight:900;font-size:16px}
.showpw{background:none;border:0;color:#5cc0ff;font-size:13px;margin-top:8px;padding:0}
.err{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:16px}

.topbar{position:sticky;top:0;z-index:10;background:rgba(2,9,20,.96);border-bottom:1px solid #164579;display:flex;align-items:center;justify-content:space-between;padding:13px 16px}
.topbar .logo{font-weight:900;font-size:18px}
.topbar .logo span{color:#ffd500}
.logout{background:none;border:1px solid #2b5a8c;color:#d8e7ff;padding:7px 12px;border-radius:9px;font-size:13px}
.wrap{max-width:900px;margin:auto;padding:16px 14px 50px}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tab{flex:none;background:#07182d;border:1px solid #15395f;color:#b9cbe1;padding:8px 13px;border-radius:20px;font-size:13px;font-weight:bold}
.tab.active{background:#ffd500;border-color:#ffd500;color:#111}
.tab .n{opacity:.7;margin-left:4px}

.notice{background:#3a1010;border:1px solid #7a2626;color:#ffb3b3;padding:12px;border-radius:12px;font-size:13px;margin-bottom:14px}
.empty{text-align:center;color:#8fa8c5;padding:50px 10px}

.card{background:linear-gradient(145deg,#092044,#06152a);border:1px solid #1b528d;border-radius:16px;padding:16px;margin-bottom:12px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.pkg{font-weight:900;font-size:16px}
.price{color:#ffd500;font-weight:900;margin-top:3px}
.badge{flex:none;padding:5px 10px;border-radius:14px;font-size:12px;font-weight:bold}
.s-pending{background:#4a3a00;color:#ffd500}
.s-approved{background:#0d3a5c;color:#5cc0ff}
.s-delivered{background:#063d2b;color:#42ff9b}
.s-rejected{background:#4a1414;color:#ff7b7b}

.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #142c48;font-size:14px}
.row:last-of-type{border-bottom:0}
.row .k{color:#8ba2bb;flex:none}
.row .v{text-align:right;font-weight:bold;word-break:break-all}
.dup{display:inline-block;margin-left:6px;background:#ff3b30;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px}

.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions button{flex:1;min-width:90px;padding:11px;border:0;border-radius:10px;font-weight:900;font-size:14px}
.a-approve{background:#1e88e5;color:#fff}
.a-deliver{background:#00c853;color:#fff}
.a-reject{background:#3a1b1b;color:#ff8a8a;border:1px solid #7a2626!important}
.actions button:disabled{opacity:.5}

.modes{display:flex;gap:8px;margin-bottom:14px}
.mode{flex:1;padding:11px;border-radius:12px;border:1px solid #15395f;background:#07182d;color:#b9cbe1;font-weight:900;font-size:14px}
.mode.active{background:#1e88e5;border-color:#1e88e5;color:#fff}
.add{margin:0 0 14px}
.pkgform{background:#07182d;border:1px solid #15395f;border-radius:16px;padding:16px;margin-bottom:14px}
.pkgform h3{font-size:16px}
.form-actions{display:flex;gap:8px;margin-top:16px}
.form-actions button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:900;font-size:14px}
.a-cancel{background:#1a2b40;color:#b9cbe1}
.small-btns{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.small-btns button{flex:1;min-width:58px;padding:10px 6px;border:0;border-radius:9px;font-weight:bold;font-size:13px;background:#12314f;color:#d8e7ff}
.small-btns button:disabled{opacity:.35}
.small-btns .danger{background:#3a1b1b;color:#ff8a8a}
</style>
</head>

<body>

<div class="login-wrap" id="loginView">
  <form class="login-box" id="loginForm">
    <h1>🎮 TopUpKoro<span>BD</span> Admin</h1>
    <p>অ্যাডমিন ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন।</p>

    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="button" class="showpw" id="showPw">Show password</button>

    <button class="btn-main" type="submit" id="loginBtn">Login</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="appView" hidden>
  <div class="topbar">
    <div class="logo">🎮 TopUpKoro<span>BD</span> Admin</div>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>

  <div class="wrap">
    <div class="modes">
      <button class="mode active" id="modeOrders">Orders</button>
      <button class="mode" id="modePkgs">Packages</button>
    </div>

    <div id="ordersView">
      <div class="tabs" id="tabs"></div>
      <div class="notice" id="notice" hidden></div>
      <div id="list"></div>
    </div>

    <div id="pkgView" hidden>
      <div class="notice" id="pkgNotice" hidden></div>
      <button class="btn-main add" id="addPkgBtn">+ New package</button>

      <form class="pkgform" id="pkgForm" hidden>
        <h3 id="pkgFormTitle">New package</h3>

        <label for="pName">Package name</label>
        <input id="pName" type="text" maxlength="80" required>

        <label for="pPrice">Price (TK)</label>
        <input id="pPrice" type="number" min="1" step="1" inputmode="numeric" required>

        <label for="pBadge">Badge (optional, e.g. HOT)</label>
        <input id="pBadge" type="text" maxlength="12">

        <div class="form-actions">
          <button type="submit" class="a-deliver" id="pSave">Save</button>
          <button type="button" class="a-cancel" id="pCancel">Cancel</button>
        </div>
      </form>

      <div id="pkgList"></div>
    </div>
  </div>
</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, addDoc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbgX0aaZ1J9mddBbNNTYpqTUBbumw5b1Y",
  authDomain: "topupkorobd-cf454.firebaseapp.com",
  projectId: "topupkorobd-cf454",
  storageBucket: "topupkorobd-cf454.firebasestorage.app",
  messagingSenderId: "564056646065",
  appId: "1:564056646065:web:5a7f48cd0c04aa13ab1d90"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = (id) => document.getElementById(id);
const STATUSES = ["all", "pending", "approved", "delivered", "rejected"];

let orders = [];
let filter = "pending";
let unsubscribe = null;
let packages = [];
let unsubPkgs = null;
let editingId = null;

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginErr").textContent = "";
  $("loginBtn").disabled = true;
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  } catch (err) {
    const msgs = {
      "auth/invalid-credential": "ইমেইল বা পাসওয়ার্ড ভুল।",
      "auth/wrong-password": "পাসওয়ার্ড ভুল।",
      "auth/user-not-found": "এই ইমেইলে ইউজার নেই।",
      "auth/invalid-email": "ইমেইলের ফরম্যাট ভুল।",
      "auth/operation-not-allowed": "Firebase এ Email/Password চালু করা নেই।",
      "auth/unauthorized-domain": "এই ডোমেইন Authorized domains এ নেই।",
      "auth/invalid-api-key": "apiKey ভুল।",
      "auth/network-request-failed": "ইন্টারনেট সমস্যা।",
      "auth/too-many-requests": "অনেকবার চেষ্টা হয়েছে, কিছুক্ষণ পর আবার চেষ্টা করুন।"
    };
    $("loginErr").textContent = (msgs[err.code] || "লগইন হয়নি।") + " (" + err.code + ")";
  }
  $("loginBtn").disabled = false;
});

$("showPw").addEventListener("click", () => {
  const p = $("password");
  const show = p.type === "password";
  p.type = show ? "text" : "password";
  $("showPw").textContent = show ? "Hide password" : "Show password";
});

$("logoutBtn").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if (user) {
    $("loginView").hidden = true;
    $("appView").hidden = false;
    startListening();
    startPackages();
  } else {
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    if (unsubPkgs) { unsubPkgs(); unsubPkgs = null; }
    packages = [];
    orders = [];
    $("appView").hidden = true;
    $("loginView").hidden = false;
    $("password").value = "";
  }
});

function startListening() {
  if (unsubscribe) unsubscribe();
  const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
  unsubscribe = onSnapshot(q,
    (snap) => {
      $("notice").hidden = true;
      orders = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      render();
    },
    (err) => {
      $("notice").hidden = false;
      $("notice").textContent =
        "অর্ডার লোড হয়নি। Firestore Rules এ ADMIN_UID ঠিক আছে কিনা দেখুন। (" + err.code + ")";
    }
  );
}

async function setStatus(id, status) {
  if ((status === "delivered" || status === "rejected") &&
      !confirm("নিশ্চিত? স্ট্যাটাস হবে: " + status)) return;
  try {
    await updateDoc(doc(db, "orders", id), { status });
  } catch (err) {
    alert("আপডেট হয়নি: " + err.code);
  }
}

function render() {
  const counts = { all: orders.length };
  STATUSES.slice(1).forEach((s) => counts[s] = orders.filter((o) => o.status === s).length);

  const tabs = $("tabs");
  tabs.textContent = "";
  STATUSES.forEach((s) => {
    const b = document.createElement("button");
    b.className = "tab" + (s === filter ? " active" : "");
    b.append(s.charAt(0).toUpperCase() + s.slice(1));
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = counts[s];
    b.append(n);
    b.onclick = () => { filter = s; render(); };
    tabs.append(b);
  });

  const trxCount = {};
  orders.forEach((o) => {
    const t = String(o.trx || "").trim().toLowerCase();
    if (t) trxCount[t] = (trxCount[t] || 0) + 1;
  });

  const list = $("list");
  list.textContent = "";
  const shown = orders.filter((o) => filter === "all" || o.status === filter);

  if (!shown.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "এই ক্যাটাগরিতে কোনো অর্ডার নেই।";
    list.append(d);
    return;
  }

  shown.forEach((o) => list.append(buildCard(o, trxCount)));
}

function buildCard(o, trxCount) {
  const card = document.createElement("div");
  card.className = "card";

  const top = document.createElement("div");
  top.className = "card-top";
  const left = document.createElement("div");
  const pkg = document.createElement("div");
  pkg.className = "pkg";
  pkg.textContent = o.package || "-";
  const price = document.createElement("div");
  price.className = "price";
  price.textContent = (o.price ?? "-") + " TK";
  left.append(pkg, price);

  const badge = document.createElement("div");
  badge.className = "badge s-" + (o.status || "pending");
  badge.textContent = o.status || "pending";
  top.append(left, badge);
  card.append(top);

  const when = o.createdAt && o.createdAt.toDate
    ? o.createdAt.toDate().toLocaleString("en-GB") : "-";

  card.append(
    row("eFootball ID", o.userId),
    row("KONAMI", o.konami),
    row("Phone", o.phone),
    row("Gmail", o.gmail),
    row("TrxID", o.trx, trxCount[String(o.trx || "").trim().toLowerCase()] > 1),
    row("Time", when)
  );

  const act = document.createElement("div");
  act.className = "actions";
  if (o.status === "pending") {
    act.append(btn("Approve", "a-approve", () => setStatus(o.id, "approved")));
  }
  if (o.status === "pending" || o.status === "approved") {
    act.append(btn("Delivered", "a-deliver", () => setStatus(o.id, "delivered")));
  }
  if (o.status !== "rejected" && o.status !== "delivered") {
    act.append(btn("Reject", "a-reject", () => setStatus(o.id, "rejected")));
  }
  if (act.children.length) card.append(act);

  return card;
}

function row(k, v, dup) {
  const r = document.createElement("div");
  r.className = "row";
  const a = document.createElement("span");
  a.className = "k";
  a.textContent = k;
  const b = document.createElement("span");
  b.className = "v";
  b.textContent = v || "-";
  if (dup) {
    const d = document.createElement("span");
    d.className = "dup";
    d.textContent = "DUPLICATE";
    b.append(d);
  }
  r.append(a, b);
  return r;
}

function btn(text, cls, fn) {
  const b = document.createElement("button");
  b.className = cls;
  b.textContent = text;
  b.onclick = fn;
  return b;
}

/* ================= PACKAGES ================= */

const DEFAULT_PACKAGES = [
  ["300 Coin", 390, ""],
  ["50 Coin + Luis Suarez ✅", 150, "HOT"],
  ["100 Coin + Iker Casillas ✅", 370, "POPULAR"],
  ["130 Coin", 190, ""],
  ["550 Coin", 620, ""],
  ["1040 Coin", 1100, ""],
  ["2,130 Coin", 2090, ""],
  ["3250 Coin", 3070, ""],
  ["5700 Coin", 5100, ""],
  ["12800 Coin", 11300, ""],
  ["750 Coin", 780, ""],
  ["12800 + 5700 Coin + Gift 130 Coin", 16400, ""]
];

$("modeOrders").onclick = () => setMode("orders");
$("modePkgs").onclick = () => setMode("pkgs");

function setMode(m) {
  $("ordersView").hidden = m !== "orders";
  $("pkgView").hidden = m !== "pkgs";
  $("modeOrders").classList.toggle("active", m === "orders");
  $("modePkgs").classList.toggle("active", m === "pkgs");
}

function startPackages() {
  if (unsubPkgs) unsubPkgs();
  const q = query(collection(db, "packages"), orderBy("sort", "asc"));
  unsubPkgs = onSnapshot(q,
    (snap) => {
      $("pkgNotice").hidden = true;
      packages = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderPackages();
    },
    (err) => {
      $("pkgNotice").hidden = false;
      $("pkgNotice").textContent =
        "প্যাকেজ লোড হয়নি। Firestore Rules এ packages যোগ করা হয়েছে কিনা দেখুন। (" + err.code + ")";
    }
  );
}

function renderPackages() {
  const list = $("pkgList");
  list.textContent = "";

  if (!packages.length) {
    const box = document.createElement("div");
    box.className = "empty";
    box.textContent = "এখনো কোনো প্যাকেজ নেই। সাইটে এখন আগের ডিফল্ট প্যাকেজ দেখাচ্ছে।";
    const b = document.createElement("button");
    b.className = "btn-main";
    b.textContent = "ডিফল্ট প্যাকেজগুলো লোড করুন";
    b.onclick = () => { b.disabled = true; seedDefaults(); };
    box.append(document.createElement("br"), b);
    list.append(box);
    return;
  }

  packages.forEach((p, i) => list.append(buildPkgCard(p, i)));
}

function buildPkgCard(p, i) {
  const card = document.createElement("div");
  card.className = "card";

  const top = document.createElement("div");
  top.className = "card-top";

  const left = document.createElement("div");
  const nm = document.createElement("div");
  nm.className = "pkg";
  nm.textContent = p.name || "-";
  const pr = document.createElement("div");
  pr.className = "price";
  pr.textContent = (p.price ?? "-") + " TK" + (p.badge ? "  •  " + p.badge : "");
  left.append(nm, pr);

  const on = p.active !== false;
  const st = document.createElement("div");
  st.className = "badge " + (on ? "s-delivered" : "s-rejected");
  st.textContent = on ? "Visible" : "Hidden";

  top.append(left, st);
  card.append(top);

  const bar = document.createElement("div");
  bar.className = "small-btns";

  const up = btn("↑", "", () => movePkg(i, -1));
  up.disabled = i === 0;
  const down = btn("↓", "", () => movePkg(i, 1));
  down.disabled = i === packages.length - 1;

  bar.append(
    up,
    down,
    btn("Edit", "", () => openForm(p)),
    btn(on ? "Hide" : "Show", "", () => togglePkg(p)),
    btn("Delete", "danger", () => deletePkg(p))
  );
  card.append(bar);

  return card;
}

function openForm(p) {
  editingId = p ? p.id : null;
  $("pkgFormTitle").textContent = p ? "Edit package" : "New package";
  $("pName").value = p ? (p.name || "") : "";
  $("pPrice").value = p ? (p.price ?? "") : "";
  $("pBadge").value = p ? (p.badge || "") : "";
  $("pkgForm").hidden = false;
  $("pkgForm").scrollIntoView({ behavior: "smooth", block: "start" });
}

$("addPkgBtn").onclick = () => openForm(null);

$("pCancel").onclick = () => {
  $("pkgForm").hidden = true;
  editingId = null;
};

$("pkgForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("pName").value.trim();
  const price = Math.round(Number($("pPrice").value));
  const badge = $("pBadge").value.trim();

  if (!name || !(price > 0)) {
    alert("নাম ও দাম ঠিকভাবে দিন।");
    return;
  }

  $("pSave").disabled = true;
  try {
    if (editingId) {
      await updateDoc(doc(db, "packages", editingId), { name, price, badge });
    } else {
      const maxSort = packages.reduce((m, p) => Math.max(m, p.sort || 0), 0);
      await addDoc(collection(db, "packages"),
        { name, price, badge, active: true, sort: maxSort + 1 });
    }
    $("pkgForm").hidden = true;
    editingId = null;
  } catch (err) {
    alert("সেভ হয়নি: " + err.code);
  }
  $("pSave").disabled = false;
});

async function togglePkg(p) {
  try {
    await updateDoc(doc(db, "packages", p.id), { active: p.active === false });
  } catch (err) {
    alert("আপডেট হয়নি: " + err.code);
  }
}

async function deletePkg(p) {
  if (!confirm("মুছে ফেলবেন? " + p.name)) return;
  try {
    await deleteDoc(doc(db, "packages", p.id));
  } catch (err) {
    alert("মোছা যায়নি: " + err.code);
  }
}

async function movePkg(i, dir) {
  const a = packages[i], b = packages[i + dir];
  if (!a || !b) return;
  try {
    await updateDoc(doc(db, "packages", a.id), { sort: b.sort });
    await updateDoc(doc(db, "packages", b.id), { sort: a.sort });
  } catch (err) {
    alert("সরানো যায়নি: " + err.code);
  }
}

async function seedDefaults() {
  if (!confirm("১২টি ডিফল্ট প্যাকেজ যোগ হবে। ঠিক আছে?")) {
    renderPackages();
    return;
  }
  try {
    for (let i = 0; i < DEFAULT_PACKAGES.length; i++) {
      const d = DEFAULT_PACKAGES[i];
      await addDoc(collection(db, "packages"),
        { name: d[0], price: d[1], badge: d[2], active: true, sort: i + 1 });
    }
  } catch (err) {
    alert("লোড হয়নি: " + err.code);
    renderPackages();
  }
}
</script>

</body>
</html>
